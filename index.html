    $$('[data-rm]',w).forEach(b=>b.onclick=async e=>{e.stopPropagation();const a=d.arquivos[+b.dataset.rm];if(!await confirmar('Remover arquivo','"'+a.nome+'" sai da pasta e vai para a lixeira do Drive.',{danger:true,ok:'Remover'}))return;try{if(a.drive_id)await fn('/apagar',{drive_id:a.drive_id});}catch(x){}d.arquivos.splice(+b.dataset.rm,1);this.desenhar();this.mudou();});
    const z=$('.hb-pasta',w);z.ondragover=e=>{e.preventDefault();e.stopPropagation();z.classList.add('over');};z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=async e=>{e.preventDefault();e.stopPropagation();z.classList.remove('over');const its=await arquivosDoDrop(e.dataTransfer);if(!its.length)return;const topo=(!d.nome&&!d.arquivos.length&&its.every(x=>x.topo===its[0].topo)&&its[0].topo)||null;this.enviar(its.map(x=>({file:x.file,rel:x.topo&&!topo?x.topo+(x.rel?'/'+x.rel:''):x.rel})),topo);};}
  // itens: [{file, rel}] (rel = subpasta dentro desta pasta); topo: nome sugerido quando a pasta ainda não tem nome
  async enviar(itens,topo){itens=(itens||[]).filter(x=>x&&x.file);if(!itens.length)return;const d=this.d;
    if(!d.nome)d.nome=topo||'Pasta';
    const prog=progresso('Enviando para "'+d.nome+'"',itens.length);const pastas={};
    try{
      if(!d.drive_pasta){const j=await fn('/pasta/criar',{pagina_id:S.pagina.id,caminho:d.nome});d.drive_pasta=j.pasta;d.link=j.link;}
      pastas['']=d.drive_pasta;let n=0;
      for(const it of itens){n++;prog.passo(n,it.file.name);const rel=(it.rel||'').replace(/^\/+|\/+$/g,'');
        if(rel&&!pastas[rel]){const j=await fn('/pasta/criar',{pagina_id:S.pagina.id,caminho:d.nome+'/'+rel});pastas[rel]=j.pasta;}
        const a=await uploadArquivo(it.file,S.pagina.id,pastas[rel],{quieto:true});
        if(a){d.arquivos.push({drive_id:a.drive_id,nome:a.nome,mime:a.mime,tamanho:a.tamanho,link:a.link,rel});this.desenhar();}}
      prog.fim(n+' '+(n===1?'arquivo enviado':'arquivos enviados')+' para "'+d.nome+'"');
    }catch(e){prog.fim(false);toast('Falha: '+e.message,{erro:true,ms:7000});this.desenhar();}
    this.mudou();}
  mudou(){S.dirty=true;agendarSalvar();}
  renderSettings(){return [{icon:'📁',label:'Abrir pasta no Drive',onActivate:()=>{if(this.d.link)window.open(this.d.link,'_blank');},closeOnActivate:true}];}
  save(){const d={...this.d};delete d._fila;return d;}}

/* ---- upload ---- */
function escolherArquivos(cb,accept,multi){const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;if(multi)i.multiple=true;i.onchange=()=>cb(Array.from(i.files));i.click();}
function escolherPasta(cb){const i=document.createElement('input');i.type='file';i.webkitdirectory=true;i.multiple=true;i.onchange=()=>{const fs=Array.from(i.files);cb(fs.map(f=>{const parts=(f.webkitRelativePath||f.name).split('/');return {file:f,topo:parts[0],rel:parts.slice(1,-1).join('/')};}));};i.click();}
// arrastar: lê arquivos e pastas (webkitGetAsEntry) → [{file,rel,topo}] (rel = subpasta dentro do que foi solto)
async function arquivosDoDrop(dt){const out=[];const items=Array.from(dt.items||[]);const entries=items.map(it=>it.webkitGetAsEntry&&it.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length)return Array.from(dt.files||[]).map(f=>({file:f,rel:'',topo:''}));
  const ler=(en,rel,topo)=>new Promise(res=>{if(en.isFile){en.file(f=>{out.push({file:f,rel,topo});res();},()=>res());}
    else if(en.isDirectory){const r=en.createReader();const lerTudo=acc=>r.readEntries(async es=>{if(!es.length){for(const e of acc)await ler(e,rel?rel+'/'+en.name:(topo?en.name:''),topo||en.name);res();}else lerTudo(acc.concat(es));},()=>res());lerTudo([]);}else res();});
  for(const en of entries){if(en.isDirectory)await ler(en,'',null);else await ler(en,'','');}
  // para pastas: topo = nome da pasta solta; rel = caminho relativo dentro dela
  return out.map(x=>{if(x.topo&&x.rel===x.topo)x.rel='';if(x.topo&&x.rel.startsWith(x.topo+'/'))x.rel=x.rel.slice(x.topo.length+1);return x;});}
function progresso(titulo,total){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="spin" style="border-top-color:var(--gold-soft)"></span><span class="pt"></span>';$('#toasts').appendChild(t);const pt=$('.pt',t);pt.textContent=titulo+' 1/'+total;
  return {passo:(n,nome)=>{pt.textContent=titulo+' '+n+'/'+total+(nome?' · '+nome:'');},fim:(msg)=>{t.remove();if(msg!==false)toast(msg||(total+' arquivos enviados para o Drive'));}};}
async function uploadArquivo(file,paginaId,pastaId,opts){opts=opts||{};if(!file)return null;const quieto=!!opts.quieto;
  try{
    if(file.size<=4*1024*1024){const fd=new FormData();fd.append('file',file);fd.append('pagina_id',paginaId);fd.append('nome',file.name);if(pastaId)fd.append('pasta_id',pastaId);const j=await fn('/upload',fd);if(!quieto)toast('Arquivo enviado para o Drive');return j.arquivo;}
    // arquivos maiores: sessão retomável, os bytes vão direto para o Google
    const ini=await fn('/upload/iniciar',{pagina_id:paginaId,nome:file.name,mime:file.type||'application/octet-stream',tamanho:file.size,pasta_id:pastaId||null});
    const pr=quieto?null:progresso('Enviando '+file.name+' ('+fmtBytes(file.size)+')',1);
    const r=await fetch(ini.sessao,{method:'PUT',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});
    if(!r.ok)throw new Error('O Google recusou o envio ('+r.status+').');
    const g=await r.json();const j=await fn('/upload/concluir',{pagina_id:paginaId,drive_id:g.id,pasta:ini.pasta});
    if(pr)pr.fim('Arquivo enviado para o Drive');return j.arquivo;
  }catch(e){toast('Falha no envio de '+file.name+': '+e.message,{erro:true,ms:7000});return null;}}

/* ---- montar / destruir ---- */
function montarEditor(p,host){if(!host)return;destruirEditor();const ro=!podeEditar();
  const ed=new EditorJS({holder:host,data:p.conteudo&&p.conteudo.blocks?p.conteudo:{blocks:[]},placeholder:ro?'':'Escreva algo, ou digite "/" para inserir um bloco…',readOnly:ro,i18n:I18N,autofocus:false,minHeight:120,
    tools:{

      callout:{class:Callout,inlineToolbar:true},
      quote:{class:Quote,inlineToolbar:true,config:{quotePlaceholder:'Citação',captionPlaceholder:'Autor'}},
      toggle:{class:ToggleBlock,inlineToolbar:true,config:{placeholder:'Toggle'}},
      table:{class:Table,inlineToolbar:true,config:{rows:2,cols:3,withHeadings:true}},

    },

    onReady:()=>{if(ro)return;try{new Undo({editor:ed});new DragDrop(ed);}catch(e){}}
  });
  S.editor=ed;S.editorPaginaId=p.id;
  // colar arquivos/imagens direto no editor
  const inserirArquivos=async fs=>{if(!fs.length)return;const prog=fs.length>1?progresso('Enviando arquivos',fs.length):null;let n=0;for(const f of fs){n++;prog&&prog.passo(n,f.name);const a=await uploadArquivo(f,p.id,null,{quieto:!!prog});if(a)ed.blocks.insert('arquivo',{modo:a.mime.startsWith('image/')?'imagem':a.mime.startsWith('video/')?'video':'arquivo',...a});}prog&&prog.fim();S.dirty=true;agendarSalvar();};
  host.addEventListener('paste',async e=>{if(ro)return;const fs=Array.from(e.clipboardData.files||[]);if(!fs.length)return;e.preventDefault();inserirArquivos(fs);});
  host.addEventListener('drop',async e=>{if(ro)return;if(e.target.closest&&e.target.closest('.hb-pasta,.hb-upload'))return;const dt=e.dataTransfer;if(!dt||(!dt.files.length&&!dt.items.length))return;e.preventDefault();e.stopPropagation();
    const its=await arquivosDoDrop(dt);if(!its.length)return;
    const soltos=its.filter(x=>!x.topo).map(x=>x.file);const porPasta={};its.filter(x=>x.topo).forEach(x=>{(porPasta[x.topo]=porPasta[x.topo]||[]).push({file:x.file,rel:x.rel});});
    for(const topo in porPasta){const id=sid();PASTA_FILA[id]={itens:porPasta[topo],topo};ed.blocks.insert('pasta',{nome:topo,_fila:id});}
    await inserirArquivos(soltos);},true);
  // backup local não enviado?
  try{const b=JSON.parse(localStorage.getItem('hub_bkp_'+p.id)||'null');if(b&&b.em>new Date(p.atualizado_em).getTime()){toast('Há alterações não enviadas desta página.',{acao:'Restaurar',onAcao:async()=>{await ed.isReady;ed.render(b.conteudo);S.pagina.titulo=b.titulo;$('.page-title').textContent=b.titulo;S.dirty=true;agendarSalvar();},ms:10000});}}catch(e){}}
function destruirEditor(){if(S.editor){try{S.editor.destroy();}catch(e){}S.editor=null;S.editorPaginaId=null;}}

/* ---- texto plano (busca) e markdown ---- */
function semTags(h){const d=document.createElement('div');d.innerHTML=String(h||'');return d.textContent||'';}
function textoPlano(conteudo,props,esquema){const out=[];const bl=(conteudo&&conteudo.blocks)||[];const itens=l=>(l||[]).forEach(i=>{out.push(semTags(i.content));itens(i.items);});
  bl.forEach(b=>{const d=b.data||{};switch(b.type){case 'paragraph':case 'header':out.push(semTags(d.text));break;case 'list':itens(d.items);break;case 'callout':out.push(semTags(d.text));break;case 'quote':out.push(semTags(d.text),semTags(d.caption));break;case 'toggle':out.push(semTags(d.text));break;case 'table':(d.content||[]).forEach(r=>out.push(r.map(semTags).join(' ')));break;case 'code':out.push(d.code);break;case 'arquivo':out.push(d.nome,d.legenda);break;case 'pasta':out.push(d.nome,...(d.arquivos||[]).map(a=>a.nome));break;case 'link':out.push(d.titulo,d.url);break;default:if(d.text)out.push(semTags(d.text));}});
  if(props&&esquema&&esquema.props)esquema.props.forEach(pr=>{const v=props[pr.id];if(v==null||v==='')return;if(Array.isArray(v))out.push(v.map(x=>typeof x==='object'?(x.nome||''):x).join(' '));else if(typeof v==='object')out.push(v.inicio||'');else out.push(String(v));});
  return out.filter(Boolean).join('\n').slice(0,200000);}
function blocosParaMD(conteudo){const bl=(conteudo&&conteudo.blocks)||[];const inl=h=>semTags(String(h||'').replace(/<b>|<strong>/g,'**').replace(/<\/b>|<\/strong>/g,'**').replace(/<i>|<em>/g,'_').replace(/<\/i>|<\/em>/g,'_').replace(/<br\s*\/?>/g,'\n'));
  const lista=(it,niv,st,n)=>(it||[]).map((i,k)=>'  '.repeat(niv)+(st==='ordered'?(k+1)+'. ':st==='checklist'?'- ['+(i.meta&&i.meta.checked?'x':' ')+'] ':'- ')+inl(i.content)+'\n'+lista(i.items,niv+1,st)).join('');
  return bl.map(b=>{const d=b.data||{};switch(b.type){case 'header':return '#'.repeat(d.level||2)+' '+inl(d.text)+'\n';case 'list':return lista(d.items,0,d.style);case 'callout':return '> '+(d.icon||'')+' '+inl(d.text)+'\n';case 'quote':return '> '+inl(d.text)+'\n';case 'toggle':return '▸ **'+inl(d.text)+'**\n';case 'delimiter':return '---\n';case 'code':return '```\n'+(d.code||'')+'\n```\n';case 'table':return (d.content||[]).map((r,i)=>'| '+r.map(inl).join(' | ')+' |'+(i===0?'\n| '+r.map(()=>'---').join(' | ')+' |':'')).join('\n')+'\n';case 'arquivo':return '['+(d.nome||'arquivo')+']('+(d.link||d.url||'')+')\n';case 'pasta':return '📁 '+(d.nome||'Pasta')+'\n'+(d.arquivos||[]).map(a=>'- ['+a.nome+']('+(a.link||'')+')').join('\n')+'\n';case 'link':return '['+(d.titulo||d.url)+']('+d.url+')\n';case 'pagina':return '→ '+(S.byId[d.id]?tituloDe(S.byId[d.id]):'página')+'\n';case 'base':return '(base de dados)\n';default:return inl(d.text||'')+'\n';}}).join('\n');}


/* ===================== bases de dados: esquema, linhas, visões ===================== */
const TIPOS_PROP=[['texto','Texto'],['numero','Número'],['select','Seleção'],['multi','Multi-seleção'],['status','Status'],['data','Data'],['pessoa','Pessoa'],['checkbox','Checkbox'],['url','URL'],['email','E-mail'],['telefone','Telefone'],['arquivos','Arquivos'],['relacao','Relação'],['criado_em','Criado em'],['atualizado_em','Atualizado em']];
const CORES_TAG=['gray','brown','orange','yellow','green','blue','purple','pink','red'];
const corAleatoria=()=>CORES_TAG[Math.floor(Math.random()*CORES_TAG.length)];
function baseEsquemaPadrao(){return {props:[{id:'status',nome:'Status',tipo:'status',opcoes:[{id:'a',nome:'A fazer',cor:'gray'},{id:'b',nome:'Em andamento',cor:'blue'},{id:'c',nome:'Concluído',cor:'green'}]},{id:'resp',nome:'Responsável',tipo:'pessoa'},{id:'prazo',nome:'Prazo',tipo:'data'}]};}
function baseVisoesPadrao(){return [{id:'v1',nome:'Tabela',tipo:'tabela',props:null},{id:'v2',nome:'Kanban',tipo:'kanban',agrupar:'status'}];}
const arr=v=>v==null||v===''?[]:Array.isArray(v)?v:[v];
const B={};   // estado da base montada: {host, base, linhas, visao, opts}

function propsDe(base){return ((base.esquema&&base.esquema.props)||[]);}
function propPorId(base,id){return propsDe(base).find(p=>p.id===id);}
function opcaoDe(prop,v){if(!prop||!prop.opcoes)return null;return prop.opcoes.find(o=>o.id===v||o.nome===v)||null;}
function valorTexto(prop,v,linha){if(prop.tipo==='criado_em')return fmtData(linha.criado_em,true);if(prop.tipo==='atualizado_em')return fmtData(linha.atualizado_em,true);if(v==null||v==='')return '';
  switch(prop.tipo){case 'select':case 'status':{const o=opcaoDe(prop,v);return o?o.nome:String(v);}case 'multi':return arr(v).map(x=>{const o=opcaoDe(prop,x);return o?o.nome:x;}).join(', ');case 'data':return typeof v==='object'?fmtData(v.inicio,v.hora)+(v.fim?' → '+fmtData(v.fim,v.hora):''):fmtData(v);case 'pessoa':return arr(v).map(nomeMembro).join(', ');case 'checkbox':return v?'Sim':'Não';case 'numero':return fmtNum(v,prop.formato);case 'arquivos':return arr(v).map(a=>a&&a.nome||'').join(', ');case 'relacao':return arr(v).map(id=>(B.rel&&B.rel[id])||'…').join(', ');default:return String(v);}}
function valorHTML(prop,v,linha){if(prop.tipo==='criado_em'||prop.tipo==='atualizado_em')return '<span class="muted">'+esc(valorTexto(prop,v,linha))+'</span>';if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
  switch(prop.tipo){case 'select':case 'status':{const o=opcaoDe(prop,v);return '<span class="tag '+(o?o.cor:'')+'">'+esc(o?o.nome:v)+'</span>';}
    case 'multi':return arr(v).map(x=>{const o=opcaoDe(prop,x);return '<span class="tag '+(o?o.cor:'')+'">'+esc(o?o.nome:x)+'</span>';}).join('');
    case 'pessoa':return arr(v).map(id=>'<span class="chip"><span class="av" style="width:18px;height:18px;font-size:9px">'+esc((nomeMembro(id)||'?')[0].toUpperCase())+'</span>'+esc(nomeMembro(id)||'?')+'</span>').join('');
    case 'checkbox':return '<span class="chk-box'+(v?' on':'')+'">'+(v?'✓':'')+'</span>';
    case 'url':return '<a href="'+esc(/^https?:/.test(v)?v:'https://'+v)+'" target="_blank" onclick="event.stopPropagation()" style="text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">'+esc(v.replace(/^https?:\/\//,''))+'</a>';

// ---------- montar ----------
async function baseMontar(base,host,opts){opts=opts||{};if(!host)return;host.innerHTML='<div class="carregando"><span class="spin"></span></div>';
  base.esquema=base.esquema||baseEsquemaPadrao();base.visoes=(base.visoes&&base.visoes.length)?base.visoes:baseVisoesPadrao();

  const st={host,base,linhas:linhas||[],opts,visaoId:opts.visao||localStorage.getItem('hub_v_'+base.id)||base.visoes[0].id,busca:'',rel:{}};
  if(!base.visoes.some(v=>v.id===st.visaoId))st.visaoId=base.visoes[0].id;
  host._st=st;if(!opts.inline)Object.assign(B,st);
  await baseCarregarRelacoes(st);baseRender(st);}
async function baseCarregarRelacoes(st){const ids=new Set();propsDe(st.base).filter(p=>p.tipo==='relacao').forEach(p=>st.linhas.forEach(l=>arr(l.props[p.id]).forEach(id=>ids.add(id))));if(!ids.size)return;const {data}=await sb.from('hub_paginas').select('id,titulo').in('id',Array.from(ids));(data||[]).forEach(d=>st.rel[d.id]=d.titulo||'Sem título');B.rel=Object.assign(B.rel||{},st.rel);}

function visaoAtual(st){return st.base.visoes.find(v=>v.id===st.visaoId)||st.base.visoes[0];}
async function baseSalvar(st,patch){const b=st.base;Object.assign(b,patch||{});const {error}=await sb.from('hub_paginas').update({esquema:b.esquema,visoes:b.visoes}).eq('id',b.id);if(error)toast('Erro ao salvar a base: '+error.message,{erro:true});if(S.pagina&&S.pagina.id===b.id){S.pagina.esquema=b.esquema;S.pagina.visoes=b.visoes;}}

function baseRender(st){const v=visaoAtual(st),b=st.base;const pe=podeEditar();
  const tabs=b.visoes.map(x=>'<div class="v'+(x.id===st.visaoId?' active':'')+'" data-v="'+x.id+'"><span class="vi">'+ICO[x.tipo]+'</span>'+esc(x.nome)+'</div>').join('')+(pe?'<div class="v" data-v="__nova" title="Nova visão">+</div>':'');
  const nf=(v.filtros||[]).length;
  st.host.innerHTML='<div class="base-wrap"><div class="base-bar"><div class="views">'+tabs+'</div><div class="base-tools">'+
    '<button class="ic-btn'+(nf?' on':'')+'" data-a="filtro" title="Filtrar">⚲'+(nf?'<sup style="font-size:9px">'+nf+'</sup>':'')+'</button><button class="ic-btn'+((v.ordenar||[]).length?' on':'')+'" data-a="ordenar" title="Ordenar">⇅</button><button class="ic-btn" data-a="busca" title="Buscar na base">⌕</button>'+
    (pe?'<button class="ic-btn" data-a="props" title="Propriedades">≡</button><button class="btn btn-primary btn-sm" data-a="nova" style="margin-left:6px">+ Nova</button>':'')+'</div></div>'+
    '<div class="base-filtros" id="bf_'+b.id+'"></div><div class="base-body"></div></div>';
  const w=$('.base-wrap',st.host);
  $$('.views .v',w).forEach(t=>t.onclick=()=>{if(t.dataset.v==='__nova')return visaoNova(st);if(t.dataset.v===st.visaoId&&pe)return visaoMenu(st,t);st.visaoId=t.dataset.v;localStorage.setItem('hub_v_'+b.id,st.visaoId);st.opts.onVisao&&st.opts.onVisao(st.visaoId);baseRender(st);});

function linhaPassaFiltro(st,l,f){const p=propPorId(st.base,f.prop);if(!p)return true;let v=l.props[p.id];const vazio=v==null||v===''||(Array.isArray(v)&&!v.length);
  switch(f.op){case 'vazio':return vazio;case 'nao_vazio':return !vazio;case 'marcado':return !!v;case 'desmarcado':return !v;case 'eu':return Array.isArray(v)&&v.includes(S.me.id);
    case 'igual':if(p.tipo==='data'){const d=typeof v==='object'&&v?v.inicio:v;return (d||'').slice(0,10)===(f.valor||'');}if(p.tipo==='numero')return +v===+f.valor;return (p.tipo==='select'||p.tipo==='status')?(v===f.valor||(opcaoDe(p,v)||{}).id===f.valor):String(v||'').toLowerCase()===String(f.valor||'').toLowerCase();
    case 'diferente':return !(v===f.valor||(opcaoDe(p,v)||{}).id===f.valor);
    case 'contem':if(Array.isArray(v))return v.some(x=>x===f.valor||(opcaoDe(p,x)||{}).id===f.valor||String(x).toLowerCase().includes(String(f.valor||'').toLowerCase()));return String(valorTexto(p,v,l)).toLowerCase().includes(String(f.valor||'').toLowerCase());
    case 'nao_contem':if(Array.isArray(v))return !v.some(x=>x===f.valor||(opcaoDe(p,x)||{}).id===f.valor);return !String(valorTexto(p,v,l)).toLowerCase().includes(String(f.valor||'').toLowerCase());

function renderCalendario(st,body,ls,v){const pid=v.calendarioPor||(propsDe(st.base).find(p=>p.tipo==='data')||{}).id;if(!pid){body.innerHTML='<div class="vazio-box">Crie uma propriedade de Data para usar o calendário.</div>';return;}
  st.mes=st.mes||(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()};})();const {y,m}=st.mes;const ini=new Date(y,m,1),fim=new Date(y,m+1,0);const pad=ini.getDay();const dias=[];for(let i=pad-1;i>=0;i--){const d=new Date(y,m,-i);dias.push({d,fora:true});}for(let i=1;i<=fim.getDate();i++)dias.push({d:new Date(y,m,i)});while(dias.length%7)dias.push({d:new Date(y,m+1,dias.length-pad-fim.getDate()+1),fora:true});
  const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const porDia={};ls.forEach(l=>{const x=l.props[pid];const a=(typeof x==='object'&&x?x.inicio:x)||'';if(!a)return;const b=(typeof x==='object'&&x&&x.fim)||a;let d=new Date(a.slice(0,10)+'T12:00:00');const df=new Date(b.slice(0,10)+'T12:00:00');let g=0;while(d<=df&&g++<60){(porDia[key(d)]=porDia[key(d)]||[]).push(l);d.setDate(d.getDate()+1);}});
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];const hj=hoje();
  body.innerHTML='<div class="cal"><div class="cal-h"><button class="ic-btn" data-m="-1">‹</button><span>'+meses[m]+' '+y+'</span><button class="ic-btn" data-m="1">›</button><button class="btn btn-sm btn-ghost hoje" data-m="0">Hoje</button></div><div class="cal-g">'+['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(d=>'<div class="wd">'+d+'</div>').join('')+dias.map(x=>{const k=key(x.d);return '<div class="d'+(x.fora?' fora':'')+(k===hj?' hoje':'')+'" data-d="'+k+'"><span class="dn">'+x.d.getDate()+'</span>'+(podeEditar()?'<button class="ic-btn add">+</button>':'')+(porDia[k]||[]).map(l=>'<span class="ev" data-id="'+l.id+'">'+esc(l.titulo||'Sem título')+'</span>').join('')+'</div>';}).join('')+'</div></div>';
  $$('[data-m]',body).forEach(b=>b.onclick=()=>{const n=+b.dataset.m;if(n===0){const d=new Date();st.mes={y:d.getFullYear(),m:d.getMonth()};}else{const d=new Date(y,m+n,1);st.mes={y:d.getFullYear(),m:d.getMonth()};}baseRenderCorpo(st);});
  $$('.ev',body).forEach(e=>e.onclick=()=>peek(e.dataset.id));$$('.d .add',body).forEach(b=>b.onclick=()=>linhaNova(st,{[pid]:{inicio:b.parentElement.dataset.d,fim:'',hora:false}},true));}

function propNova(st,anchor){const html='<input class="input sm pin" id="pn_n" placeholder="Nome da propriedade"><div class="plbl">TIPO</div>'+TIPOS_PROP.map(t=>'<div class="pi" data-t="'+t[0]+'"><span class="ico">'+ICO[t[0]]+'</span><span>'+t[1]+'</span></div>').join('');
  const el=pop(anchor,html);$$('.pi',el).forEach(d=>d.onclick=async()=>{const nome=$('#pn_n',el).value.trim()||TIPOS_PROP.find(t=>t[0]===d.dataset.t)[1];popFechar();const p={id:sid(),nome,tipo:d.dataset.t};if(['select','multi','status'].includes(p.tipo))p.opcoes=[];if(p.tipo==='relacao'){const b=await escolherBase();if(b)p.base=b;}st.base.esquema.props.push(p);st.base.visoes.forEach(v=>{if(v.props)v.props.push(p.id);});await baseSalvar(st);baseRender(st);});}
function escolherBase(){return new Promise(res=>{const bases=S.tree.filter(x=>x.tipo==='base'&&!x.arquivada);const bg=modal('<div class="modal-h">Relacionar com qual base?</div><div class="modal-b">'+bases.map(b=>'<div class="pi" data-id="'+b.id+'"><span class="ico">'+iconeDe(b)+'</span><span>'+esc(tituloDe(b))+'</span></div>').join('')+'</div>',{onFechar:()=>res(null)});$$('.pi',bg).forEach(d=>d.onclick=()=>{fecharModal(bg);res(d.dataset.id);});});}
function propEditar(st,anchor,p){const html='<input class="input sm pin" id="pe_n" value="'+esc(p.nome)+'"><select class="input sm pin" id="pe_t">'+TIPOS_PROP.map(t=>'<option value="'+t[0]+'"'+(t[0]===p.tipo?' selected':'')+'>'+t[1]+'</option>').join('')+'</select>'+(p.tipo==='numero'?'<select class="input sm pin" id="pe_f"><option value="">Número</option><option value="reais"'+(p.formato==='reais'?' selected':'')+'>R$</option><option value="pct"'+(p.formato==='pct'?' selected':'')+'>%</option></select>':'')+(['select','multi','status'].includes(p.tipo)?'<div class="plbl">OPÇÕES</div><div id="pe_ops"></div><div class="pi" id="pe_add"><span class="ico">+</span><span>Adicionar opção</span></div>':'');
  const el=pop(anchor,html,{onFechar:()=>{baseSalvar(st);baseRender(st);}});
  $('#pe_n',el).oninput=e=>{p.nome=e.target.value;};$('#pe_t',el).onchange=e=>{p.tipo=e.target.value;if(['select','multi','status'].includes(p.tipo)&&!p.opcoes)p.opcoes=[];};const f=$('#pe_f',el);if(f)f.onchange=e=>{p.formato=e.target.value;};
  const ops=$('#pe_ops',el);const renderOps=()=>{if(!ops)return;ops.innerHTML=(p.opcoes||[]).map((o,i)=>'<div class="pi" data-i="'+i+'"><span class="dot '+o.cor+'" data-c="1"></span><input class="input sm" value="'+esc(o.nome)+'" style="padding:3px 6px;font-size:13px;border:none;background:transparent;flex:1"><span class="sub" data-rm="1" style="cursor:pointer">✕</span></div>').join('');
    $$('.pi',ops).forEach(d=>{const o=p.opcoes[+d.dataset.i];$('input',d).oninput=e=>{o.nome=e.target.value;};$('[data-rm]',d).onclick=()=>{p.opcoes.splice(+d.dataset.i,1);renderOps();};$('[data-c]',d).onclick=()=>{o.cor=CORES_TAG[(CORES_TAG.indexOf(o.cor)+1)%CORES_TAG.length];renderOps();};});};renderOps();
  const add=$('#pe_add',el);if(add)add.onclick=()=>{p.opcoes.push({id:sid(),nome:'Opção '+(p.opcoes.length+1),cor:corAleatoria()});renderOps();const last=$$('#pe_ops input',el).pop();last&&last.focus();last&&last.select();};}
function propsMenu(st,anchor){const v=visaoAtual(st);const vis=propsVisiveis(st,v).map(p=>p.id);const html='<div class="plbl">PROPRIEDADES NA VISÃO</div>'+propsDe(st.base).map(p=>'<div class="pi" data-p="'+p.id+'"><span class="ico">'+ICO[p.tipo]+'</span><span>'+esc(p.nome)+'</span><span class="sub">'+(vis.includes(p.id)?'👁':'◌')+'</span></div>').join('')+'<div class="psep"></div><div class="pi" data-p="__add"><span class="ico">+</span><span>Nova propriedade</span></div>';
  const el=pop(anchor,html,{onFechar:()=>{baseSalvar(st);baseRender(st);}});$$('.pi',el).forEach(d=>d.onclick=()=>{if(d.dataset.p==='__add'){popFechar();return propNova(st,anchor);}const id=d.dataset.p;v.props=vis.includes(id)?vis.filter(x=>x!==id):propsDe(st.base).map(p=>p.id).filter(x=>vis.includes(x)||x===id);propsMenu(st,anchor);});}

// ---------- visões ----------
function visaoNova(st){const tipos=[['tabela','Tabela'],['kanban','Kanban'],['lista','Lista'],['galeria','Galeria'],['calendario','Calendário']];const bg=modal('<div class="modal-h">Nova visão</div><div class="modal-b"><div class="field"><label>Nome</label><input class="input" id="vn_n" placeholder="Ex.: Por responsável"></div><div class="field"><label>Tipo</label><select class="input" id="vn_t">'+tipos.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('')+'</select></div></div><div class="modal-f"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" id="vn_ok">Criar</button></div>');
  $('#vn_ok',bg).onclick=async()=>{const t=$('#vn_t',bg).value;const v={id:sid(),nome:$('#vn_n',bg).value.trim()||tipos.find(x=>x[0]===t)[1],tipo:t,props:null};if(t==='kanban')v.agrupar=(propsDe(st.base).find(p=>p.tipo==='status'||p.tipo==='select')||{}).id;if(t==='calendario')v.calendarioPor=(propsDe(st.base).find(p=>p.tipo==='data')||{}).id;st.base.visoes.push(v);st.visaoId=v.id;fecharModal(bg);await baseSalvar(st);baseRender(st);};}
function visaoMenu(st,anchor){const v=visaoAtual(st);const itens=[{t:'Renomear',ico:'✎',f:async()=>{const n=await perguntar('Nome da visão',v.nome);if(n!=null){v.nome=n;baseSalvar(st);baseRender(st);}}},{lbl:'Tipo'}].concat([['tabela','Tabela'],['kanban','Kanban'],['lista','Lista'],['galeria','Galeria'],['calendario','Calendário']].map(t=>({t:t[1],ico:ICO[t[0]],sub:v.tipo===t[0]?'✓':'',f:()=>{v.tipo=t[0];if(t[0]==='kanban'&&!v.agrupar)v.agrupar=(propsDe(st.base).find(p=>p.tipo==='status'||p.tipo==='select')||{}).id;if(t[0]==='calendario'&&!v.calendarioPor)v.calendarioPor=(propsDe(st.base).find(p=>p.tipo==='data')||{}).id;baseSalvar(st);baseRender(st);}})));
  if(v.tipo==='kanban'||v.tipo==='tabela'||v.tipo==='lista')itens.push({lbl:'Agrupar por'},...propsDe(st.base).filter(p=>['select','status','pessoa','checkbox'].includes(p.tipo)).map(p=>({t:p.nome,ico:ICO[p.tipo],sub:v.agrupar===p.id?'✓':'',f:()=>{v.agrupar=v.agrupar===p.id&&v.tipo!=='kanban'?null:p.id;baseSalvar(st);baseRender(st);}})));
  if(v.tipo==='calendario')itens.push({lbl:'Data do calendário'},...propsDe(st.base).filter(p=>p.tipo==='data').map(p=>({t:p.nome,ico:'📅',sub:v.calendarioPor===p.id?'✓':'',f:()=>{v.calendarioPor=p.id;baseSalvar(st);baseRender(st);}})));
  if(st.base.visoes.length>1)itens.push('-',{t:'Excluir visão',ico:'🗑',danger:true,f:()=>{st.base.visoes=st.base.visoes.filter(x=>x.id!==v.id);st.visaoId=st.base.visoes[0].id;baseSalvar(st);baseRender(st);}});
  menu(anchor,itens);}

// ---------- painel de propriedades de uma linha (página) ----------
async function propsMontar(p,host){if(!host)return;const base=S.byId[p.base_id]?null:null;let b=(S.pagina&&S.pagina._base)||null;if(!b||b.id!==p.base_id){const {data}=await sb.from('hub_paginas').select('id,titulo,esquema,visoes').eq('id',p.base_id).maybeSingle();b=data;}if(!b)return;p._base=b;
  const st={host,base:b,linhas:[p],opts:{},rel:{}};await baseCarregarRelacoes(st);
  const render=()=>{host.innerHTML='<div class="props">'+propsDe(b).map(pr=>{const h=valorHTML(pr,p.props[pr.id],p);return '<div class="prop-row"><div class="pk" data-p="'+pr.id+'"><span class="pt-ico">'+ICO[pr.tipo]+'</span><span>'+esc(pr.nome)+'</span></div><div class="pv'+(h?'':' vazio')+'" data-p="'+pr.id+'">'+(h||'Vazio')+'</div></div>';}).join('')+(podeEditar()?'<div class="props-add" id="pr_add">+ Adicionar propriedade</div>':'')+'</div>';
    $$('.pv',host).forEach(c=>{const pr=propPorId(b,c.dataset.p);c.onclick=()=>{if(!podeEditar())return;celulaEditarPainel(st,c,p,pr,render);};});
    $$('.pk',host).forEach(k=>k.onclick=()=>{if(podeEditar())propEditar(st,k,propPorId(b,k.dataset.p));});
    const a=$('#pr_add',host);if(a)a.onclick=()=>propNova(st,a);};
  const _salvar=baseSalvar;render();
  // ao salvar o esquema pelo painel, re-renderizar
  host._st=Object.assign(st,{host:{innerHTML:'',_st:st},_render:render});
  const origRender=baseRender;}
function celulaEditarPainel(st,c,l,p,render){const refaz=()=>render();const v=l.props[p.id];
  switch(p.tipo){case 'checkbox':linhaSet(st,l,p.id,!v).then(refaz);return;case 'select':case 'status':return selectPicker(c,p,v,async nv=>{await linhaSet(st,l,p.id,nv);refaz();},st);case 'multi':return multiPicker(c,p,arr(v),async nv=>{await linhaSet(st,l,p.id,nv);refaz();},st);case 'pessoa':return pessoaPicker(c,arr(v),async nv=>{await linhaSet(st,l,p.id,nv);refaz();});case 'data':return dataPicker(c,v,async nv=>{await linhaSet(st,l,p.id,nv);refaz();});case 'arquivos':return arquivosPicker(c,arr(v),l,async nv=>{await linhaSet(st,l,p.id,nv);refaz();});case 'relacao':return relacaoPicker(c,p,arr(v),async nv=>{await linhaSet(st,l,p.id,nv);await baseCarregarRelacoes(st);refaz();});case 'criado_em':case 'atualizado_em':return;
    default:{c.classList.remove('vazio');c.innerHTML=p.tipo==='texto'?'<textarea class="input sm" style="width:100%;min-height:60px">'+esc(v==null?'':v)+'</textarea>':'<input class="input sm" type="'+(p.tipo==='numero'?'number':'text')+'" value="'+esc(v==null?'':v)+'" style="width:100%">';const i=$('input,textarea',c);i.focus();i.onclick=e=>e.stopPropagation();const fim=async()=>{let nv=i.value;if(p.tipo==='numero')nv=nv===''?null:+nv;await linhaSet(st,l,p.id,nv);refaz();};i.onblur=fim;i.onkeydown=e=>{if(e.key==='Enter'&&!(p.tipo==='texto'&&e.shiftKey)){e.preventDefault();i.blur();}if(e.key==='Escape'){i.value=v==null?'':v;i.blur();}};}}}


/* ===================== configurações: membros, Google Drive, aparência ===================== */
async function viewConfig(aba){destruirEditor();S.pagina=null;renderTopActions();setCrumbs([{t:'Configurações',go:'config'}]);document.title='Configurações · Hub';aba=aba||'membros';
  const tabs=[['membros','Membros'],['drive','Google Drive'],['aparencia','Aparência'],['sobre','Sobre']];
  $('#content').innerHTML='<div class="cfg"><h1>Configurações</h1><div class="cfg-tabs">'+tabs.map(t=>'<button class="'+(t[0]===aba?'active':'')+'" onclick="go(\'config\',\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div><div id="cfg_body"><div class="carregando"><span class="spin"></span></div></div></div>';
  const b=$('#cfg_body');
  if(aba==='membros')await cfgMembros(b);else if(aba==='drive')await cfgDrive(b);else if(aba==='aparencia')cfgAparencia(b);else cfgSobre(b);}

async function cfgMembros(b){const {data}=await sb.from('hub_membros').select('*').order('nome');const mem=data||[];S.membros=mem.slice();if(!S.membros.some(m=>m.user_id===S.me.id))S.membros.push({user_id:S.me.id,email:S.me.email,nome:S.me.nome,papel:S.papel});
  const papel={admin:'Administrador',editor:'Editor',leitor:'Leitor'};
  b.innerHTML='<div class="card"><h3>Quem acessa o Hub</h3><p>Administradores do Flow entram automaticamente. Os demais precisam ser adicionados aqui. Editores criam e editam páginas; leitores só leem.</p></div>'+
    '<div class="card lst" id="m_list">'+mem.map(m=>'<div class="it"><span class="av">'+esc((m.nome||m.email)[0].toUpperCase())+'</span><div class="grow"><div class="nm">'+esc(m.nome||m.email)+(m.user_id===S.me.id?' <span class="chip">você</span>':'')+'</div><div class="em">'+esc(m.email)+' · '+papel[m.papel]+(m.google_email?' · Drive: '+esc(m.google_email):'')+'</div></div>'+(ehAdmin()?'<button class="btn btn-sm btn-ghost" onclick="membroMenu(this,\''+m.user_id+'\')">···</button>':'')+'</div>').join('')+(mem.length?'':'<div class="vazio-box">Nenhum membro além dos administradores do Flow.</div>')+'</div>'+
    (ehAdmin()?'<button class="btn btn-primary" onclick="membroNovo()">+ Adicionar membro</button>':'');}
function membroNovo(m){m=m||{};const bg=modal('<div class="modal-h">'+(m.user_id?'Editar membro':'Novo membro')+'</div><div class="modal-b">'+
  '<div class="field"><label>Nome</label><input class="input" id="mb_nome" value="'+esc(m.nome||'')+'"></div>'+
  '<div class="field"><label>E-mail (login)</label><input class="input" id="mb_email" type="email" value="'+esc(m.email||'')+'" '+(m.user_id?'disabled':'')+'></div>'+
  (m.user_id?'':'<div class="field"><label>Senha inicial</label><input class="input" id="mb_senha" placeholder="mínimo 6 caracteres"><div class="small soft" style="margin-top:4px">Passe para a pessoa junto com o link do Hub. Ela pode trocar depois em "Esqueci minha senha".</div></div>')+
  '<div class="field"><label>Papel</label><select class="input" id="mb_papel"><option value="editor"'+(m.papel==='editor'?' selected':'')+'>Editor (cria e edita)</option><option value="leitor"'+(m.papel==='leitor'?' selected':'')+'>Leitor (só lê)</option><option value="admin"'+(m.papel==='admin'?' selected':'')+'>Administrador</option></select></div>'+
  '<div class="field"><label>E-mail do Google (opcional)</label><input class="input" id="mb_g" value="'+esc(m.google_email||'')+'" placeholder="para ver a pasta no Drive"><div class="small soft" style="margin-top:4px">Compartilha a pasta "Lidera Hub" do Drive com esse e-mail.</div></div>'+
  '</div><div class="modal-f"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" id="mb_ok">Salvar</button></div>');
  $('#mb_ok',bg).onclick=async()=>{const nome=$('#mb_nome',bg).value.trim(),email=$('#mb_email',bg).value.trim().toLowerCase(),papel=$('#mb_papel',bg).value,g=$('#mb_g',bg).value.trim();const btn=$('#mb_ok',bg);btn.disabled=true;
    try{if(m.user_id){const {error}=await sb.from('hub_membros').update({nome,papel,google_email:g||null}).eq('user_id',m.user_id);if(error)throw error;}
      else{const senha=$('#mb_senha',bg).value;const j=await fn('/membro/criar',{email,nome,senha,papel,google_email:g});if(j.ja_existia)toast('A conta já existia; a senha foi atualizada.');}
      if(g){try{await fn('/compartilhar',{email:g,papel:papel==='leitor'?'reader':'writer'});}catch(e){toast('Membro salvo, mas o Drive não compartilhou: '+e.message,{erro:true,ms:7000});}}
      fecharModal(bg);toast('Membro salvo');viewConfig('membros');}catch(e){btn.disabled=false;toast(e.message,{erro:true,ms:6000});}};}
function membroMenu(anchor,id){const m=S.membros.find(x=>x.user_id===id);if(!m)return;menu(anchor,[{t:'Editar',ico:'✎',f:()=>membroNovo(m)},{t:'Definir nova senha',ico:'🔑',f:async()=>{const s=await perguntar('Nova senha para '+(m.nome||m.email),'',{ph:'mínimo 6 caracteres'});if(!s)return;try{await fn('/membro/senha',{user_id:id,senha:s});toast('Senha atualizada');}catch(e){toast(e.message,{erro:true});}}},'-',{t:'Remover do Hub',ico:'🗑',danger:true,f:async()=>{if(id===S.me.id)return toast('Você não pode remover a si mesmo.',{erro:true});if(!await confirmar('Remover membro','"'+(m.nome||m.email)+'" perde o acesso ao Hub. A conta no Flow (se existir) continua.',{danger:true,ok:'Remover'}))return;try{await fn('/membro/remover',{user_id:id,apagar_conta:true});toast('Removido');viewConfig('membros');}catch(e){toast(e.message,{erro:true});}}}],{alinhar:'dir'});}

async function cfgDrive(b){let st={conectado:false};try{st=await fn('/status');}catch(e){st.erro=e.message;}
  b.innerHTML='<div class="card"><h3>Google Drive</h3><p>Todo arquivo enviado pelo Hub (imagens, PDFs, planilhas, vídeos) é guardado na pasta <b>Lidera Hub</b> do Google Drive da conta conectada, com uma subpasta por página. Nada fica em outro servidor.</p>'+
    '<div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+(st.conectado?'<span class="chip" style="background:var(--green-bg);color:var(--green)">● Conectado</span><span class="small muted">'+esc(st.email||'')+'</span>'+(st.pasta_link?'<a class="btn btn-sm btn-ghost" href="'+esc(st.pasta_link)+'" target="_blank">Abrir pasta no Drive ↗</a>':''):'<span class="chip" style="background:var(--red-bg);color:var(--red)">● Não conectado</span>'+(st.erro?'<span class="small muted">'+esc(st.erro)+'</span>':''))+'</div>'+
    (ehAdmin()?'<div style="margin-top:14px"><button class="btn btn-primary" onclick="driveConectar()">'+(st.conectado?'Reconectar com outra conta':'Conectar o Google Drive')+'</button><div class="small soft" style="margin-top:6px">Use a conta contato@somoslidera.com.br. Só precisa fazer uma vez.</div></div>':'<p style="margin-top:10px">Só administradores conectam o Drive.</p>')+'</div>'+
    '<div class="card"><h3>Como funciona</h3><p>Arquivos pequenos passam pela função do Hub; os grandes (vídeos, PDFs pesados) vão direto do seu navegador para o Google Drive, sem limite prático de tamanho. Você também pode colar um link do Drive na página e ele aparece embutido.</p></div>';}
async function driveConectar(){try{const j=await fn('/oauth/url');location.href=j.url;}catch(e){toast(e.message,{erro:true,ms:7000});}}
function cfgAparencia(b){const t=localStorage.getItem('hub_tema')||'auto';b.innerHTML='<div class="card"><h3>Tema</h3><p>Vale só para este aparelho.</p><div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">'+[['auto','Automático'],['claro','Claro'],['escuro','Escuro']].map(x=>'<button class="btn '+(t===x[0]?'btn-primary':'btn-ghost')+'" onclick="localStorage.setItem(\'hub_tema\',\''+x[0]+'\');temaAplicar();cfgAparencia(document.getElementById(\'cfg_body\'))">'+x[1]+'</button>').join('')+'</div></div>'+
  '<div class="card"><h3>No celular</h3><p>Abra o Hub no navegador, toque em Compartilhar e em "Adicionar à Tela de Início". Ele vira um aplicativo.</p></div>';}
function cfgSobre(b){b.innerHTML='<div class="card"><h3>Hub · by Lidera</h3><p>Base de conhecimento da Lidera, no lugar do Notion. Páginas e bases ficam no banco do Flow (Supabase); arquivos ficam no Google Drive. Busca em todo o conteúdo, histórico de versões, bases com tabela, kanban, lista, galeria e calendário.</p><p style="margin-top:8px">Atalhos: <b>⌘K</b> buscar · <b>/</b> inserir bloco · <b>⌘S</b> salvar agora · <b>⌘Z</b> desfazer.</p></div>';}


/* ===================== boot ===================== */
async function bootApp(){temaAplicar();
  const h=location.hash;
  if(h.indexOf('type=recovery')>=0){await sleep(400);telaNovaSenha();return;}
  if(h.indexOf('access_token')>=0){await sleep(600);history.replaceState(null,'',location.pathname);}
  if(location.search.indexOf('drive=ok')>=0){history.replaceState(null,'',location.pathname+'#config/drive');toast('Google Drive conectado!');}
  let session=null;try{session=(await sb.auth.getSession()).data.session;}catch(e){}
  if(!session){showLogin();return;}
  await afterAuth();}
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')telaNovaSenha();if(ev==='SIGNED_OUT'){S.me=null;showLogin();}});
document.addEventListener('DOMContentLoaded',bootApp);

</script>
